[project]
name = "lorelie"
version = "0.1.0.dev3"
description = "Lorelie is a Python package that provides APIs to interact with SLite databases. It is designed to be easy to use and efficient, making it a great choice for developers who need to work with SQLite databases in their Python applications."
keywords = ["ORM", "database", "Python", "SQLAlchemy", "SQLite"]
authors = [
    { name = "John Pendenque", email = "pendenquejohn@gmail.com" },
]
maintainers = [
    { name = "John Pendenque", email = "pendenquejohn@gmail.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",   
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.3.3",
    "asgiref>=3.11.1",
    "pytz>=2026.1.post1",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "factory-boy>=3.3.3",
    "fastapi[standard,stantard]>=0.141.1",
    "fastmcp[standard]>=3.4.7",
    "mcp>=1.29.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-aio>=2.1.7",
    "pytest-celery>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-datafiles>=3.0.1",
    "pytest-django>=4.12.0",
    "pytest-env>=1.6.0",
    "pytest-playwright>=0.8.0",
    "pytest-reportlog>=1.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.16",
]

[project.urls]
Homepage = "https://github.com/Zadigo/lorelie"
Documentation = "https://github.com/Zadigo/lorelie/wiki"
Repository = "https://github.com/Zadigo/lorelie.git"
Changelog = "https://github.com/Zadigo/lorelie/blob/main/CHANGELOG.md"

[tool.pyright]
typeCheckingMode = "off"
reportMissingImports = true
reportUntypedBaseClass = true

[tool.pytest]
timeout="5000"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests as api tests",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.pytest_env]
env_files = [".env", ".env.test"]

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true
aggressive = 3

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "*/typings.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.uv.build-backend]
source-exclude = [
    "tests/**",
    "docs/**",
    "*.log",
    "**/.DS_Store",
]
